[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeverify"
version = "0.1.0"
description = "Autonomous code verification & bug-patching multi-agent system built on LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
codeverify-bench = "codeverify.eval.cli:main"
codeverify-serve = "codeverify.api.app:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["benchmarks/dataset"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
